<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="process-model-title process-model-desc">
  <title id="process-model-title">CDSi Step Process Model</title>
  <desc id="process-model-desc">
    Semantic SVG prototype for the Step Into CDSi process model. Each process box is a distinct group with a stable
    step ID, and each transition is a distinct path that can be styled by the step servlet UI.
  </desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>

  <style>
    .canvas {
      fill: #050505;
    }

    .edge {
      fill: none;
      stroke: #5f6870;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow);
      opacity: 0.56;
    }

    .edge.loop {
      stroke-dasharray: 6 6;
    }

    .arrow-head {
      fill: #5f6870;
    }

    .step-box {
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 1;
      rx: 5;
      ry: 5;
    }

    .step-node {
      cursor: pointer;
    }

    .step-node text {
      fill: #000;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .step-node text.small {
      font-size: 15px;
    }

    .phase-main .step-box {
      fill: #c8ced5;
    }

    .phase-evaluation .step-box {
      fill: #91cbea;
    }

    .phase-forecast .step-box {
      fill: #fff69a;
    }

    .phase-series .step-box,
    .phase-relevant .step-box {
      fill: #ff8177;
    }

    .phase-vaccine-group .step-box {
      fill: #9fdb7d;
    }

    .phase-end .step-box {
      fill: #9aa1aa;
    }

    .step-node.is-current .step-box {
      stroke: #fff;
      stroke-width: 4;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.65));
    }

    .step-node.is-previous .step-box {
      stroke: #2d72d9;
      stroke-width: 4;
    }

    .step-node.is-saved .step-box {
      stroke: #25a46a;
      stroke-width: 4;
    }

    .edge.is-active-edge {
      stroke: #fff;
      stroke-width: 4;
      opacity: 1;
    }

    .step-node.is-disabled {
      cursor: default;
      opacity: 0.45;
    }
  </style>

  <rect class="canvas" x="0" y="0" width="1400" height="760" />

  <g id="process-edges" aria-hidden="true">
