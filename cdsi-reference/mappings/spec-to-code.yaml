# Specification-to-code mapping (Phase 8 of the reference-module plan).
#
# Only the two pilot sections are populated so far - see the "Logic
# Specification Milestone" in the plan for when this should be extended to
# all of Chapters 4-9. Every class name here has been read directly from
# cdsi-engine's source, not guessed.
spec_version: "4.6"
sections:
  "4.1":
    title: "Gather Necessary Data"
    implementation:
      module: "cdsi-engine"
      classes:
        - "org.openimmunizationsoftware.cdsi.core.logic.GatherNecessaryData"
        - "org.openimmunizationsoftware.cdsi.core.data.ForecastInput"
    tests:
      - "test-gap: no dedicated unit test; exercised indirectly by every cdsi-fits-tests fixture"
    mapping_status: "reviewed"
  "6.4":
    title: "Evaluate Age"
    implementation:
      module: "cdsi-engine"
      classes:
        - "org.openimmunizationsoftware.cdsi.core.logic.EvaluateAge"
    tests:
      - "test-gap: no dedicated unit test; exercised indirectly by cdsi-fits-tests fixtures with age-dependent forecasts"
    mapping_status: "reviewed"
