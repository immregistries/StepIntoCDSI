# Specification-to-code mapping (Phase 8 of the reference-module plan).
#
# Chapters 4-5 and the two pilot sections (4.1, 6.4) are populated so far -
# see the "Logic Specification Milestone" in the plan for extending this to
# the rest of Chapters 6-9. Every class name here has been read directly
# from cdsi-engine's source, not guessed.
spec_version: "4.6"
sections:
