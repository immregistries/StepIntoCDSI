      for both; and Table 6-8's interval condition reads the same reference
      date, pinned with a conditional skip interval date that falls between the
      two candidate reference dates. (c) The class's own construction and
      identity: EVALUATE_CONDITIONAL_SKIP_FOR_FORECAST, chapter "7.1", Table
