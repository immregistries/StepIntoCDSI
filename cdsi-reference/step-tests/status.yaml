      expected a published "Conflict End Interval Date" of 01/25/2016, 01/25/2016
      and 01/29/2016 respectively; actual no such attribute published at all. (6)
      theConflictEndIntervalDateIsLaterThanTheConflictBeginIntervalDate - expected
      the published end interval date to be later than the published begin
      interval date; actual both are 02/02/2016, identical. (7)
      conflictThreeReportsADoseInsideTheConflictWindow - expected a dose given
      01/15/2016 inside the 01/02/2016-01/25/2016 window to record
      "VirusConflict"; actual an empty status cause. (8)
      conflictThreeIncludesTheConflictBeginIntervalDateItself - expected a dose
      given on 01/02/2016, the begin interval date itself, to record
      "VirusConflict"; actual an empty status cause. (9)
