      constructor's single context switch: CONDSKIP-2's Conditional Skip
      Reference Date is the Assessment Date when determining a forecast (6.2's
      arm takes the Date Administered instead), including the case where no
      assessment date is supplied and Table 6-4's assumed current date is what
