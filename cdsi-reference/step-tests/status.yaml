      update in place on the existing Schedule-routing entry in
      cross-cutting-notes.md rather than as a new entry, since it is the same
      underlying contraindication issue seen from the consuming end. Worth
      noting downstream: PatientSeriesStatus.CONTRAINDICATED is set nowhere in
