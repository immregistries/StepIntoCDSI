    notes: >-
      11 test methods in one class, 8 green and 3 red. 6.3 is a small step - one
      attribute table (6-12), one decision table (6-13) with a single condition
      and two rules, no business rules - so the unit is fully covered apart from
      the two items listed at the end.

      Covered. The step's identity (EVALUATE_FOR_INADVERTENT_VACCINE, chapter
      "6.3") and its Table 6-12 attribute table name; both Table 6-12 attributes
      being registered and the first carrying the vaccine dose administered 4.4
      has made current; Table 6-13's encoding (label, one condition, two rules,
      Yes/No grid); Rule 1's three documented state changes (target dose status
      'Not Satisfied', evaluation status 'Not Valid', evaluation reason
      'Inadvertent Administration') and its transition back to 4.4; Rule 1
      matching any one of several inadvertent vaccine types, and matching by CVX
      code rather than object identity; Rule 2 making no state change at all and
      continuing to 6.4 Evaluate Age; and a target dose with no inadvertent
      vaccine types never taking Rule 1.

