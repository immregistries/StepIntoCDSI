      date and the date administered not met, actual none of the three met,
      because 01/01/1900 is outside all of them. (6)
      theIntervalConditionIsAnsweredAgainstTheForecastedEarliestDateToo - same
      substitution through Table 6-8's second condition; expected the reference
      date 09/01/2023 to have passed the CALCDTSKIP-5 interval date 01/15/2023
      so the condition is met, actual reference date 01/01/1900 and not met.
      CALCDTSKIP-5 itself computes 01/15/2023 correctly. (7)
      anIllogicalRecommendationSetsTheTargetDoseSkipped - Table 6-11's "Yes"
      outcome; expected TargetDoseStatus.SKIPPED, actual NOT_SATISFIED
