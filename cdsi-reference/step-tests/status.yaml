      dose; actual "VirusConflictVirusConflict".

      Reds (2) through (9) all trace to two things in the same class, both
      observable from the tests without any classification of them. First, the
      step's per-previous-dose loop runs from selectedAntigenAdministeredRecordPos
      + 1 upward through a list 4.2 sorted ascending by date administered, so the
      doses it inspects are the ones administered after the current dose, not the
      "previous vaccine dose administered" all three business rules name; with a
      spec-shaped history the loop body never executes and neither calculated date
      is published. Second, where the loop does execute, the conflict end interval
      date is computed from getConflictBeginInterval().getAmount() and
      getConflictBeginInterval().getType() rather than from either of the two
      intervals CALCDTCONFLICT-2 names, so the end date always equals the begin
      date and CONFLICT-3's window is empty.

      Materiality, checked against the Supporting Data release bundled in
      cdsi-engine/src/main/resources. It holds 625 liveVirusConflict entries
      across 25 impacted ("current") vaccine types. Every one of the 625 has a
      conflictBeginInterval of "1 day" and end intervals between "24 days" and "30
      days", so begin does not equal end in 625 of 625 - an empty CONFLICT-3
      window for every conflict the release defines. 200 of the 625 have a
      minConflictEndInterval that differs from their conflictEndInterval (the four
      shapes are 24/28, 28/30, 26/30 and 24/30 days), so CALCDTCONFLICT-2's
      Valid-versus-not-Valid branch changes the answer for 200 of them; the
      implementation reads neither field and consults no previous dose's
      evaluation status anywhere. All 25 impacted vaccine types carry more than
      one distinct interval triple across their entries, and the step's
      setIntervalDate matches on the impacted type only, ignoring the conflicting
