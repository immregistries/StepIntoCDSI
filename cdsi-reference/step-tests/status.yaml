      aConditionalSkipInstanceCarriesTheContextThatDecidesWhetherSevenOneMayUseIt
      - expected ConditionalSkip to carry the context 7.1's entry condition
      turns on ("Only Conditional Skip Instances with a context of Forecast or
      Both apply here"); actual, the class has no context field at all, so the
      entry condition cannot even be expressed. This is the same domain-model
      gap 6.2's red (1) found, and it is asserted here rather than inherited
      because 7.1's entry condition is its own and, more importantly, because
      the consequence on this side is different in kind - see the next
      paragraph. The gap lives in ConditionalSkip and DataModelLoader, not in
      EvaluateConditionalSkip, so per cdsi-engine/AGENTS.md it is likely
      upstream_step_defect territory rather than an edit to this unit's class;
      that classification is Role B's call and nothing here has been recorded as
      a finding yet.

      7.1's side of the ConditionalSkip context problem, checked against the
      Supporting Data release bundled in cdsi-engine/src/main/resources. 484
      <seriesDose> elements carry a <conditionalSkip> element, but 287 of those
      are empty placeholders that DataModelLoader's `populated` guard correctly
      discards (so they never overwrite anything, and no series dose mixes an
      empty element with a real one). That leaves 264 real instances - 140
      "Both", 57 "Evaluation", 67 "Forecast" - across 197 series doses: 127 with
      a single "Both" instance, 54 Evaluation-then-Forecast, 13
      Both-then-Forecast, and 3 with a single "Evaluation" instance. Because
      SeriesDose holds exactly one ConditionalSkip and setConditionalSkip is
      called once per element, the last one parsed wins. The result is
      asymmetric, not a mirror image of 6.2's: in all 67 two-instance cases the
      retained instance is the Forecast one, which is exactly the instance 7.1
      is required to use - so 7.1 gets the right instance by the accident of
      document order, with no filtering involved, in every case where 6.2 loses
      the one it needed. What 7.1 loses instead is the opposite kind of error
      and much smaller: the 3 Evaluation-only series doses, where 7.1 applies a
      conditional skip whose context excludes it. So 6.2's symptom is
      under-application (67 doses) and 7.1's is over-application (3 doses), from
      one shared cause. The sequencing consequence matters for Role B and is
      recorded in cross-cutting-notes.md's existing ConditionalSkip entry, which
      was updated in place rather than duplicated: a loader-only "keep the
      first instance instead of the last" fix would repair 6.2's 67 cases and
      simultaneously break 7.1's 67, because the two units want different
      instances from the same list. Only giving ConditionalSkip a context,
      accumulating every instance in the loader, and filtering at use time fixes
      both sides.

