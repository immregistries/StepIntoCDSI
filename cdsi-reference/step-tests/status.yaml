spec_version: '4.6'
units:
  '4.1':
    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.GatherNecessaryDataTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 4.1 defines no business rules and no decision tables - the
      specification explicitly puts this step "outside of the purview of this
      document" - so there is no normative rule to test against. The 13 tests
      cover the step package's documented State Changes and Next Steps instead:
      Patient (dob/gender) populated from ForecastInput; ImmunizationHistory
      created and cross-linked with the patient's MedicalHistory; one
      VaccineDoseAdministered per input vaccination, in input order, with the
      CVX resolved to the Supporting Data VaccineType instance and the MVX as
      manufacturer; IllegalArgumentException for an unrecognized CVX code;
      optional dose condition carried through and not defaulted when omitted;
      PatientObservation built from a resolved observation code, with the same
      rejection behaviour for an unrecognized code; unconditional transition to
      4.2. Considered fully covered for what 4.1 documents.

      Deliberately not covered - (a) the specification's "Evaluation and
      forecasting data" list (Schedule, Antigen Series, Series Dose, Vaccine
      Group, Antigen, Vaccine): this is Supporting Data loaded once by
      DataModelLoader.createDataModel, not by this step, and the step package
      records as an unresolved question whether 4.1 even intends it to be
      gathered per request - only the negative is asserted (4.1 leaves
      scheduleList/antigenSeriesList/antigenAdministeredRecordList untouched);
      (b) Adverse Reaction, listed by the specification as patient-related data
      but absent from ForecastInput entirely, so there is nothing to unit-test
      without inventing an input shape; (c) real CVX/observation resolution
      against an actually loaded Supporting Data release - the tests use a
      two-entry stub cvxMap/observationMap, since loading the real release is
      DataModelLoaderTest's job and would make these tests a Supporting Data
      test rather than a 4.1 test.

      Two documentation observations for Role B, neither a code defect - the
      step package's State Changes list omits that process() also copies the
      assessment date onto the DataModel (tested here anyway), and it does not
      mention that a null/empty observation code is skipped rather than
      rejected (also tested, and flagged in the test as implementation
      behaviour with no specification basis).
  '4.2':
    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.OrganizeImmunizationHistoryTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 4.2 declares no business rules and no decision tables - it is "a
      fairly simple iterative process" of three numbered steps around Figure
      4-3, with Tables 4-2/4-3 as a worked before/after example. The 11 tests
      cover all three numbered steps plus the two explanatory notes: a
      combination product expanded into one antigen administered record per
      antigen it contains (all sharing the dose's date and pointing back at it);
      a single-antigen product producing exactly one record; the record carrying
      the source dose's data elements (date administered, vaccine type,
      manufacturer, trade name, amount, lot expiration date, dose condition -
      note 2b); sorting by antigen; sorting by ascending date within an antigen;
      the whole Table 4-2 history organizing into all 19 Table 4-3 rows in
      Table 4-3's stated order; an empty history and an antigen-less product
      each producing no records; the unconditional transition to 4.3; and note
      2a's age-based CVX-to-antigen association, from both sides.

      9 green, 2 red. Both red tests are note 2a and fail for the same single
      reason - zosterLiveGivenBelowFiftyYearsIsAssociatedWithVaricellaOnly
      (expected [Varicella], actual [Varicella, Zoster]) and
      zosterLiveGivenAtOrAboveFiftyYearsIsAssociatedWithZosterOnly (expected
      [Zoster], actual [Varicella, Zoster]). Note 2a requires the CVX to Antigen
      Supporting Data's Association Begin Age / Association End Age to select
      the antigen by the patient's age at administration ("a Zoster vaccine
      administered below 50 years should be associated with Varicella"), and
      CVX 121 in the bundled releases does carry those attributes (Varicella
      [0 days, 50 years), Zoster [50 years, -)). OrganizeImmunizationHistory
      creates a record for every antigen in
      vda.getVaccine().getVaccineType().getAntigenList() with no age filter, so
      one CVX 121 dose always yields both records at any age. For Role B: the
      cause is not confined to this step's class - DataModelLoader.readCvx
      reads only the <antigen> child of each <association> and discards
      associationBeginAge/associationEndAge, and VaccineType holds a plain
      List<Antigen> with nowhere to put them, so the association ages never
      reach this step at all. Role A records this as observation only, with no
      finding filed and no classification attempted.

      Deliberately not covered - (a) Figure 4-3's own activity-diagram data
      element list: both extracted copies of the figure image are blank, so the
      record's contents are tested against note 2b's prose and what the
      AntigenAdministeredRecord(vda, antigen) constructor documents rather than
      against the diagram; (b) the comparator's case sensitivity (it compares
      names with equalsIgnoreCase for equality but case-sensitive compareTo for
      ordering, and is technically inconsistent when an antigen is null) - the
      specification says nothing about either, and no real Supporting Data
      antigen name exercises them; (c) null immunization history / null
      administration date, which NPE - not behaviour 4.2 documents.

      The two note-2a tests are the only ones that load a bundled CDC
      supporting data release (the way DataModelLoaderTest does); everything
      else uses hand-built domain objects. That load is unavoidable there,
      since the Association Begin/End Age attributes exist only in the release
      XML and in no hand-buildable domain object.
  '4.3':
    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.CreateRelevantPatientSeriesTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 4.3 defines no inputs, no business rules and no decision tables of
      its own, and says so explicitly: 4.3 and Chapter 5 share the title "Create
      Relevant Patient Series", and it is Chapter 5 (5.1, Tables 5-2/5-4/5-5,
      CALCDTIND-1/CALCDTIND-2) that holds the actual relevance logic. 4.3 itself
      is a paragraph in Chapter 4's processing-model overview that the
      specification deliberately leaves as orchestration - "similar to gathering
      necessary data (section 4.1), create relevant patient series will likely
      vary from system to system." So, as with 4.1, there is no normative rule
      here to mismatch, and the 15 tests pin the step package's documented State
      Changes and Next Steps instead - i.e. that CreateRelevantPatientSeries is
      the loop driver around 5.1, not a decision step.

      Covered: the first call builds antigenSelectedList from every antigen on
      the data model and starts at position 0, delegating to 5.1 with the first
      antigen in place for 5.1 to read; every antigen is visited exactly once,
      in the data model's antigen-list order, one delegation to 5.1 per antigen;
      the loop then transitions to 4.4, and stays at 4.4 on further calls rather
      than wrapping or reading out of bounds; subsequent calls reuse the same
      selected-list instance and only advance the position counter; no antigens
      at all skips straight to 4.4 without ever delegating; the caller-supplied
      antigen label filter restricts the loop to the named antigens, while a
      null, empty, unmatched or differently-cased filter all fall back to every
      antigen; the selected list holds the Supporting Data Antigen instances
      themselves (5.1 compares antigenSeries.getTargetDisease() against them);
      antigens the patient has no dose for are still iterated; and driving the
      whole loop leaves every piece of Chapter 5 state untouched
      (antigenSeriesSelectedList, selectedPatientSeriesList, current antigen).

      15 green, 0 red. No spec-vs-code gap found for this unit. Considered fully
      covered for what 4.3 itself documents.

      Deliberately not covered - (a) the specification's State Changes sentence
      "each antigen series relevant for the patient is turned into a relevant
      patient series... those not relevant are excluded from further
      processing": that decision is made entirely in 5.1, which this step only
      delegates to, so testing it here would be a 5.1 test wearing a 4.3 label -
      only the negative is asserted (4.3 creates no patient series and selects
      no antigen series itself); (b) literal antigen iteration order:
      DataModel.getAntigenList() is built from a HashMap's values, so the order
      is not specified by anything and asserting a fixed one would be brittle -
      the tests assert instead that the loop visits exactly the data model's
      antigen list, each entry once, in whatever order that list reports; (c)
      running 4.3 against a real loaded Supporting Data release - the step reads
      nothing but the antigen map, so a hand-built model exercises every branch
      and a real release would only make it slower.

      Three observations for Role B, none of them a code defect and none
      recorded as a finding. (1) The step package's State Changes says the first
      call builds the list from "all antigens the patient has data for"; the
      code actually iterates every antigen in the loaded Supporting Data,
      independent of the immunization history. The code is right - filtering to
      antigens the patient has data for would suppress forecasts for everything
      never administered - so this is a documentation imprecision in index.md,
      pinned by antigensThePatientHasNoDataForAreStillIterated. (2)
      transitions.yaml states the 5.1 branch's condition as "the antigen-selected
      list has not been built yet, or more antigens remain to iterate"; the
      first clause is not sufficient on its own - with zero antigens the first
      call builds the list and goes directly to 4.4, which is what
      noAntigensAtAllSkipsStraightToEvaluateAndForecast pins. (3) Every
      subsequent call also calls dataModel.incAntigenAdministeredRecordPos(),
      which State Changes does not mention ("just advances the position
      counter", singular). That field is written by this one line and read
      nowhere else in cdsi-engine or cdsi-web - the evaluation loop reads the
      distinct selectedAntigenAdministeredRecordPos - so it is currently inert
      vestigial code. Pinned as-is by
      subsequentCallsAlsoAdvanceTheUnrelatedAntigenAdministeredRecordPosition so
      the behaviour is recorded before anyone starts reading that field; not
      classified, per Role A scope.
  '4.4':
    test_status: tests_written
    test_class: >-
      org.openimmunizationsoftware.cdsi.core.logic.EvaluateAndForecastAllPatientSeriesTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 4.4 declares no business rules and no decision tables of its own -
      the clinical logic it orchestrates is Chapters 6 and 7 - but unlike 4.1 and
      4.3 it is not rule-free: Figures 4-5 and 4-6 define a state machine, and
      that is what the 21 tests pin. Covered: Figure 4-6's setup (one target dose
      per series dose in series order, starting on the first target dose and the
      first antigen administered record, with the record list filtered to the
      series' own antigen); the "if no antigen administered records exist" branch
      straight to forecasting; not-satisfied keeping the target dose and
      advancing the record; not-satisfied with no records left ending evaluation
      and beginning forecasting for the target dose evaluation stopped on;
      satisfied advancing both collections; the recurring-dose branch creating a
      duplicate target dose that tracks the same series dose and continues the
      walk; the terminal "set evaluation status to Extraneous for any
      un-evaluated antigen administered records" box; the Purpose's "each
      relevant patient series will have ... a forecast"; Figure 4-5's outer loop
      (next relevant patient series set up from scratch, then 4.5 with the
      per-series working state cleared, plus the no-series-at-all degenerate
      case). Also pinned, each labelled in the test javadoc as having no
      specification counterpart: the SKIPPED/SUBSTITUTED/UNNECESSARY arms of the
      TargetDoseStatus switch, the SKIPPED-in-forecast transition from
      transitions.yaml, the "don't advance the record until Chapter 6 has
      recorded an evaluation" guard, and the two loop guards (>1000 cycles,
      >200 repeated states) the step package's Review Findings flags.

      18 green, 3 red. (1)
      everyRecordLeftUnevaluatedWhenTargetDosesRunOutIsMarkedExtraneous -
      expected both records left un-evaluated to be EXTRANEOUS, actual only the
      last one: markRestAsExtraneous() loops from aarPos + 1, but aarPos already
      points at the first un-evaluated record because the SATISFIED arm
      incremented it before calling moveToNextTargetDoseIfAvailable(), so the
      first leftover record is skipped. (2)
      anExplicitlyNonRecurringLastTargetDoseAlsoMarksTheRestExtraneous -
      expected the two leftover records to be EXTRANEOUS, actual none at all:
      moveToNextTargetDoseIfAvailable() only calls markRestAsExtraneous() when
      the series dose has no RecurringDose object at all; an explicit
      recurringDose of "No" returns false without marking anything. Every
      seriesDose in the bundled Supporting Data releases carries a recurringDose
      element (62 of 62 in HepB) and DomUtils maps "No" to YesNo.NO, so in
      production the marking path is never reached and no record is ever set
      EXTRANEOUS by this step. (3)
      satisfyingARecurringMidSeriesTargetDoseAlsoCreatesAnotherOne - expected a
      satisfied recurring target dose to create another target dose (Figure 4-6
      asks "is this target dose a recurring target dose?" of every satisfied
      dose, and only the No branch reaches "is there another target dose to
      process?"), actual no duplicate is created unless the target dose list is
      already exhausted, and the recurring flag consulted at that point is the
      last dose's rather than the recurring one's. Not hypothetical: the bundled
      releases contain nine non-final series doses with recurringDose Yes (all
      COVID-19). The assertion is deliberately position-agnostic - it asserts
      only that the duplicate exists - because Figure 4-6 does not say where
      "another target dose" goes, and this step package's State Changes
      ("inserted immediately after it") and the implementation (appended at the
      end) read that differently; the placement question is the ambiguous part
      and is left untested.

      Deliberately not covered: (a) the ALERT.MISSING "currentPatientSeries is
      null" -> END transition, which is unreachable through the public API -
      process() increments the stepper whenever it is unstarted, so hasCurrent()
      true implies getCurrent() non-null, and forcing it would mean reaching into
      Stepper's private position rather than testing 4.4; (b) the ALERT.INVARIANT
      out-of-range aarIndex and empty-target-dose-list alerts, which are log-only
      and similarly unreachable without corrupting the data model by hand; (c)
      what Chapters 6 and 7 do once dispatched to - the tests assert only which
      step 4.4 hands off to and what state it leaves behind, and never call
      process() on the returned step; (d) a full multi-series drive of the loop
      to completion, which would need a stand-in for every Chapter 6/7 step and
      would be an engine test rather than a 4.4 test.
  '4.5':
    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.SelectBestPatientSeriesTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 4.5 declares no inputs, no business rules and no decision tables -
      it says outright that selecting the best patient series "at the highest
      level is a simple iterative process which loops through each antigen and
      applies the business rules found in Chapter 8 to each antigen", and all
      the scoring and prioritization logic lives in 8.1 through 8.9. Like 4.3,
      the class named for the chapter-4 summary is the outer loop. What is
      normative is Figure 4-7, a small concrete state machine - Get first
      antigen, then a loop of Select Best Patient Series (Chapter 8) followed by
      the decision "Is there another antigen to process?", Yes leading to Get
      next antigen and back into Chapter 8, No ending the process - plus one
      prose claim with real consequences for state: "multiple best patient
      series may be selected for a patient", which requires the
      bestPatientSeriesList to accumulate across the loop rather than reset per
      antigen.

      19 tests, all 19 green. They cover Figure 4-7 end to end (first call
      selects the first antigen and delegates to 8.1; each re-entry advances one
      antigen; every antigen is handed to Chapter 8 exactly once, in the
      antigen-selected list's order; the loop ends at 4.6; calling again after
      the loop has ended stays at 4.6; no antigens at all goes straight to 4.6),
      the documented State Changes (antigenSeriesSelectedList filtered from the
      full Supporting Data antigen series list to the current antigen and
      rebuilt each iteration; selectedPatientSeriesList filtered from the
      patient series stepper to the current antigen and rebuilt each iteration;
      an antigen with no patient series still gets its turn with an empty list;
      antigen matching is by Antigen.equals, i.e. by name not instance identity;
      the prioritized patient series list emptied in place before each antigen
      reaches Chapter 8; the best patient series list created before the first
      antigen reaches 8.9, which adds to it with no null guard of its own, and
      never replaced afterwards), the accumulation claim from the Purpose (two
      antigens' best series both survive to 4.6), and the negative claim that
      4.5 selects, prioritizes and pre-filters nothing itself.

      One observation for review, deliberately pinned as actual behaviour rather
      than asserted as a defect. The step package's State Changes says that once
      the antigens are exhausted the step "clears per-antigen state"; the code
      nulls dataModel.antigen and antigenSeriesSelectedList but leaves
      selectedPatientSeriesList holding the last antigen's patient series.
      Section 4.5 itself says nothing about state, and nothing in cdsi-engine
      reads selectedPatientSeriesList after the loop ends (its only readers,
      SelectPrioritizedPatientSeries and CompletePatientSeries, are Chapter 8
      steps that no longer run), so this is read as an imprecision in the
      step package's wording rather than a code defect - following the same
      precedent as 4.3's "all antigens the patient has data for" nit. It is not
      purely theoretical though:
      LogicStepRenderer.printSelectBestPatientSeriesPost prints "Done checking
      Antigens" and then lists that very list, so the cdsi-web step view shows
      the last antigen's patient series under a heading implying none is
      current. Recorded as observation only - no finding filed, no
      classification attempted. A second, smaller observation: 4.5 is the only
      writer of antigenSeriesSelectedList and nothing in cdsi-engine or cdsi-web
      reads it, so that documented State Change is currently inert; the tests
      pin it anyway so it is visible if someone starts reading it.

      Deliberately not covered - (a) everything the Purpose says about Series
      Groups and Equivalent Series Groups ("a best patient series will be
      selected for each Series Group ... some antigen series define Equivalent
      Series Groups which allow a single best series to be selected from across
      multiple Series Groups"): 4.5 loops by antigen only and never touches a
      series group, and the series-group reasoning lives entirely in Table 8-14
      inside DetermineBestPatientSeries, so testing it here would be testing
      8.9's class under 4.5's name; (b) the emergency entries into 4.5 from
      EvaluateAndForecastAllPatientSeries' two loop guards and
      ForecastDatesAndReasons' cycle guard, which can start 4.5's antigen loop
      before 4.4 has finished: those transitions have no basis in 4.5's own
      specification text and belong to 4.4's and 7.x's units, which already pin
      them from their own side; (c) any assertion involving a real Supporting
      Data release - the step reads only 4.3's antigen-selected list, the
      antigen series list and the patient series stepper, all of which are
      cheaper and clearer to hand-build, and nothing in 4.5 depends on the
      content of a release. Considered fully covered for what 4.5 documents.
  '4.6':
    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.IdentifyAndEvaluateVaccineGroupTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 4.6 declares no inputs, no business rules and no decision tables,
      and says so outright: "The process of identifying and evaluating a vaccine
      group at the highest level is a simple iterative process which loops
      through each vaccine group and applies the business rules defined in
      Chapter 9 to each vaccine group." Every rule that actually merges
      antigen-level forecasts into a vaccine-group forecast lives in Chapter 9 -
      9.1's Table 9-2, 9.2, and 9.3's Table 9-4. So this is the same shape as 4.3
      and 4.5: the class named for the chapter-4 summary is really the outer
      loop, and here it is the outermost loop of the whole engine, the only one
      whose exit is the end of the run rather than a handoff to another loop.
      What is normative is Figure 4-8's looping structure, plus the step
      package's documented State Changes.

      18 tests, all 18 green. They cover Figure 4-8 end to end (first call
      selects the first vaccine group and delegates to 9.1; each re-entry
      advances vaccineGroupPos by exactly one; every vaccine group is handed to
      Chapter 9 exactly once, in the vaccine group list's order; after the last
      group the run ends at END; the End step returned there really terminates
      the run, its process() returning null; no vaccine groups at all goes
      straight to END with no group ever made current; calling again after the
      loop has finished keeps ending the run rather than wrapping around, which
      matters because 9.2 and 9.3 return to 4.6 on every path they take), what
      4.6 delegates rather than decides (a multi-antigen group such as MMR is
      handed to 9.1 exactly like a single-antigen one instead of short-circuiting
      Table 9-2's single-vs-multiple decision; a group with no antigens and a
      group with no best patient series are both still visited; the loop creates
      no vaccine group forecast of its own and attaches none to the group; the
      best patient series list is passed through to Chapter 9 untouched, same
      instance and same contents, so the last group still has something to
      merge), and the State Changes as they actually behave (the last vaccine
      group stays current after the loop ends, since 4.6 clears no per-iteration
      state - unlike 4.5 - and nothing runs after it; the set of vaccine groups
      is fixed the first time the list is read, because DataModel materializes
      and caches it from the vaccine group map, so a group registered mid-loop is
      never visited; with no list explicitly set the loop iterates that map,
      which is the only path the real pipeline takes since nothing in cdsi-engine
      calls setVaccineGroupList). Two of the 18 run against a bundled CDC
      Supporting Data release and confirm the loop's real-world shape: it visits
      every vaccine group the release defines exactly once, including the
      multi-antigen groups the Purpose names, and the Chapter 9 invocation count
      per run follows the schedule rather than the patient.

      Two observations for review, both pinned as actual behaviour rather than
      asserted as defects, and neither classified. First, 4.6 applies no filter
      of its own: with the bundled release loaded, all 26 of the schedule's
      vaccine groups are handed to Chapter 9 whether or not the patient has any
      best patient series in them, and 9.2 raises its ALERT.SPECGAP "No matching
      forecast found for vaccine group" for each of the ones that are empty for
      this patient. Section 4.6 says "loops through each vaccine group" without
      qualifying which, and no business rule narrows it, so this reads as
      faithful to the text - but the alert volume it produces is worth a human
      eye, and if it is wrong the fix belongs to Chapter 9's units, not here.
      Second, the step's guard against a null vaccine group list is dead code:
      DataModel.getVaccineGroupList() re-materializes the list from the vaccine
      group map whenever the field is null, so the guarded branch and its
      vaccineGroupList_isNull log field can never be observed. A test pins that
      so the assumption is visible if DataModel's lazy initialization ever
      changes.

      Deliberately not covered - (a) the Purpose's claim that "for vaccine groups
      which contain non-equivalent series groups, it is important to only blend
      best patient series of the same series type (e.g., risk with risk and
      standard with standard)": 4.6 does no blending and never inspects a series
      type or series group, so testing it here would be testing 9.3's class under
      4.6's name, and Table 9-4 is where it belongs; (b) the order in which
      vaccine groups are visited when no list was explicitly set - it comes from
      HashMap.values() on the vaccine group map, so it is arbitrary though stable
      for a given key set, and neither section 4.6 nor Figure 4-8 states an
      order, so the tests assert set membership and visit counts there rather
      than a sequence; (c) a null entry inside the vaccine group list, which 4.6
      would make current and hand to 9.1 where Table 9-2 would dereference it -
      it cannot arise from getOrCreateVaccineGroup or from DataModelLoader, has
      no basis in 4.6's text, and a test for it would pin a hypothetical rather
      than a documented behaviour. Considered fully covered for what 4.6
      documents.
  '5.1':
    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.SelectRelevantPatientSeriesTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      Section 5.1 is the first Chapter 5 unit and, unlike the Chapter 4 loop
      drivers, it carries real decision logic: Table 5-2's nine input attributes
      with their assumed values, Table 5-3's two business rules (CALCDTIND-1 and
      CALCDTIND-2), Table 5-4 "Does the indication apply to the patient?" (one
      per indication of an antigen series) and Table 5-5 "Is an antigen series a
      relevant patient series for a patient?" (one per antigen series, reading
      the aggregate of that series' Table 5-4 answers as its third condition).
      This is where an antigen series actually becomes a PatientSeries, which is
      the scope 4.3's title shares but does not decide.

      23 tests in one class, 16 green and 7 red. Every test hand-builds the
      minimal DataModel - a patient, an assessment date, the antigen 4.3's loop
      has made current, and one or more AntigenSeries - drives process()
      directly, and inspects either the decision tables the step exposes through
      getLogicTableList() or the PatientSeries objects left on the patient
      series stepper. The step's inner tables (LTInnerSet, LT55) are
      package-visible, so their condition attributes, their per-indication
      "applies" flag and their encoded result grids are read directly rather
      than reflectively; no Supporting Data release is loaded and no other
      engine step runs.

      Green: the nine Table 5-2 attributes and their assumed values ("Unknown",
      the patient's own gender for an empty Required Gender, 01/01/1900,
      12/31/2999, the current date); CALCDTIND-1 and CALCDTIND-2 as date of
      birth plus the indication's begin/end age, and the fallback to the assumed
      dates when an indication has no begin age and the empty <endAge/> the real
      releases use; Table 5-4 Rule 2 (no matching active observation, window
      open) and Rule 4 (window closed); the window's inclusive-begin,
      exclusive-end boundary in all four directions; Table 5-5 Rule 1 for both
      Standard and Evaluation Only series, Rule 4 for a Risk series with no
      applying indication and for one with no indications at all, and a series
      with no required genders being relevant for any patient; and the step's
      scope and structure (only series whose target disease is the current
      antigen, one Table 5-4 per indication and one Table 5-5 per series, every
      relevant series becoming its own PatientSeries in antigen-series order,
      and the unconditional return to 4.3 whether or not anything was found
      relevant).

      Red, seven tests over four distinct gaps, none of them classified or
      recorded as findings - that is Role B's call. (1) Table 5-4's first
      condition, "Does the indication describe any active patient
      observations?", is a stub returning NO for every patient under a "logic
      condition not yet implemented" comment; caActivePatientObservations is
      populated from the patient's medical history and never read. Two tests are
      red on it: the condition answers NO for a patient who has exactly the
      observation the indication describes, and Table 5-4 Rule 1 therefore never
      selects, so no indication can ever apply. (2) Following from (1), Table
      5-5 Rule 3 is unreachable: a Risk series whose indication matches an
      active observation inside its age window is judged not relevant, because
      the third condition aggregates Table 5-4 answers that are always "does not
      apply". Release 4.65 defines 84 Risk series across 25 antigens driven by
      roughly 730 indications, so every one of them falls through to Rule 4
      today. (3) Table 5-5's first condition is built on LT55's own
      caGender/caRequiredGender, which the step populates only on the Table 5-4
      objects, never on the Table 5-5 - both stay null and the condition takes
      its "no required genders supplied" early return of YES for every patient,
      so Rule 2 is unreachable and a series restricted to Male is relevant for a
      Female patient. Series-level <requiredGender> elements appear in all 30
      antigen files of release 4.65, including HPV series restricted to Female
      (plus Unknown) and separate ones restricted to Male. (4) Two smaller
