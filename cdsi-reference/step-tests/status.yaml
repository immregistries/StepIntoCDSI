    test_status: tests_written
    test_class: org.openimmunizationsoftware.cdsi.core.logic.EvaluateVaccineConflictTest
    fix_status: not_started
    blocked_category: null
    blocked_reason: null
    finding_ids: []
    notes: >-
      25 tests, 14 green and 11 red. 6.7 is the one chapter-6 evaluation step
      with no decision table - version 4.4 restructured it "to be less process
      driven and more business rule based" - so Table 6-24's three business rules
      are the whole of what it normatively says, and the tests are organised
      around them rather than around a rule grid. Covered: the step's identity
      (EVALUATE_VACCINE_CONFLICT, chapter "6.7"); Table 6-23's first two rows,
      their values and their names; CALCDTCONFLICT-1's conflict begin interval
      date; both branches of CALCDTCONFLICT-2's conflict end interval date (the
      minimum conflict end interval for a previous dose with no evaluation status
      or one of 'Valid', the conflict end interval for one with a status that is
      not 'Valid'); the structural claim that the two calculated dates must
      differ; all four zones of CONFLICT-3's window (inside, the begin interval
      date itself, before it, the end interval date itself, after it); section
      6.7's "no vaccine Supporting Data for this vaccine type means no conflict"
      rule, in three forms (a current type that is not an impacted type, no
      conflict Supporting Data at all, and a previous type that is not a
      conflicting type for this impacted type); the "nothing administered on or
      before the current dose" case; the State Changes - the "VirusConflict"
      marker appended to the target dose's status cause rather than replacing it,
