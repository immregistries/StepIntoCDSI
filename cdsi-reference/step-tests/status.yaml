      satisfied, extraneous and not-satisfied outcomes, as this step package's
      transitions.yaml records; and that constructing the step decides nothing.

      What the unit found about the upstream status-cause markers. Across the
      whole of cdsi-engine there are exactly four writers of TargetDose's
      statusCause, and only three of them are ones 6.10 reads:
      EvaluateAllowableInterval (6.6) appends "Interval",
      EvaluateVaccineConflict (6.7) appends "VirusConflict",
      EvaluateForAllowableVaccine (6.9) appends "Vaccine", and EvaluateGender
      appends "Gender", which 6.10 ignores. Contrary to this step package's
      Inputs and Attributes prose, 6.5 Evaluate Preferable Interval and 6.8
      Evaluate for Preferable Vaccine write nothing at all - a preferable miss
      routes on to the allowable fallback, and only that fallback failing
      records a marker. That is exactly what Table 6-31's second and fourth
      conditions ask for ("all preferable intervals or all allowable intervals",
      "a preferable vaccine or an allowable vaccine"), so the narrower marker
      set is correct, not a gap; the index.md sentence naming 6.5 and 6.8 as
      writers is what is wrong. Because all three conditions are String.contains
      tests on one concatenated string, they are order-independent and
      duplicate-tolerant, so 6.7's ability to append "VirusConflict" twice in a
      single pass cannot change what 6.10 decides - pinned green - and 6.6's and
      6.9's markers reach 6.10 intact. 6.10 does not read the calculated dates
      6.6 was found to overwrite, so that gap is not observable here either. The
      one marker-related risk this unit does surface is not a marker defect at
      all but a rule-ordering one, below.

