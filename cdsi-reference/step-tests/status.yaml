      EVALUATE_AND_FORECAST_ALL_PATIENT_SERIES, so the 7.1 destination the
      constructor wires is unreachable dead code. (9)
      theSpecificationsHibExampleIsCaughtAsAnIllogicalForecast - the section's
      own worked example (born 01/01/2024, first dose 12/08/2024 at 11 months 1
      week, catch-up recommended for 01/05/2025, conditional skip opening at 12
      months); expected SKIPPED and re-forecasting, actual NOT_SATISFIED and
      4.4. This is reds 2, 3 and 7 in one scenario and is the clearest single
      demonstration that the section's stated purpose does not run.


      Reds 2, 7, 8 and 9 are one cause (the process() override, in 7.6's own
      class); reds 3, 4, 5 and 6 are a second, independent cause (two stubs in
      the shared base class); red 1 is a third, already-recorded one in the
      domain model and the loader. The ordering matters for Role B: fixing only
      the override would give a step that runs its decision tables and still
      never skips anything, because the reference date it would compare against
