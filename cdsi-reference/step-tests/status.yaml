      ConditionalSkip has no context field at all and SeriesDose holds exactly
      one instance. Already recorded from 6.2's and 7.1's sides in
      cross-cutting-notes.md; that entry is updated in place from this side
      rather than duplicated, and its claim that ValidateRecommendation "is not
      in any numbered unit and has not been checked" is corrected there. 7.6
