      theSupportingDatasInadvertentVaccineTypesReachTheTargetDose - expected a
      series dose loaded from the Supporting Data's own markup to carry the three
      inadvertent vaccine types it declares; actual 0, because
      DataModelLoader.readSeriesDose has no branch for the <inadvertentVaccine>
      element (it handles doseNumber, age, interval, allowableInterval,
      preferableVaccine, allowableVaccine, conditionalSkip, recurringDose,
      conditionalNeed, seasonalRecommendation, substituteDose and
      requiredGender, and drops the rest) and
      SeriesDose.setInadvertentVaccineList is called from nowhere in the engine.
      (2) tableSixTwelveSupportingDataAttributeCarriesTheInadvertentVaccineType -
      expected Table 6-12's second attribute ("Supporting Data (inadvertent
      vaccine)" / "Vaccine Type") to carry a value; actual null, because
      caInadvertentVaccine is constructed and registered but never assigned, and
      the caInadvertentVaccineList field that would hold the list is initialised
      empty and never read or written - the decision table reaches past both to
      targetDose.getTrackedSeriesDose().getInadvertentVaccineList() directly, so
      the attribute the step publishes and renders is always blank. (3)
      ruleOneRecordsItsEvaluationOnATargetDoseThatHasNoEvaluationYet - expected
      Rule 1 to record evaluation status 'Not Valid' and reason 'Inadvertent
      Administration'; actual NullPointerException, because the outcome writes to
      dataModel.getTargetDose().getEvaluation() and no evaluation exists yet on
      the path that reaches 6.3 (TargetDose starts with an empty evaluation list,
      4.4 dispatches to 6.1 without creating one, 6.1's Rule 3 and 6.2's
      cannot-be-skipped outcome record nothing, and 6.4 is the first step to call
      DataModel.setEvaluationForCurrentTargetDose). This is the same shape as the
      two reds 6.1's unit found in Table 6-3.

      Materiality of red (1), checked against the Supporting Data release bundled
      in cdsi-engine/src/main/resources. The release defines 307
      <inadvertentVaccine> entries carrying a CVX code, over 26 distinct vaccine
      types, on 115 of its 484 series doses, across 8 antigens: COVID-19 (90
      entries on 37 series doses), Polio (78 on 26 - every series dose it
      defines), Tetanus (36 on 6), Diphtheria (36 on 6), RSV (34 on 7 - every
      one), Pneumococcal (15 on 15), HPV (12 on 12) and Pertussis (6 on 6). All
