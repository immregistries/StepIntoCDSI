      would be a brittle test rather than a behaviour, so it is recorded here
      instead. (2) The evaluation status, which section 6.10 Satisfy Target Dose
      decides. (3) The target dose's status cause - 6.8 never writes to it, and
      process() ends by calling next(), which constructs the following step. (4)
      Whether a Rule 1 match should clear an evaluation reason an earlier chapter-6
      step left behind; Table 6-26's outcomes name only what 6.8 records, never
      what it preserves. (5) The wording of Table 6-26's four condition rows and of
      its title question, following 6.4, 6.5 and 6.6's precedent - only the table
      number, its shape and its grid are pinned. (6) forecastVaccineType and mvx,
      which the loader reads onto a preferable vaccine but Table 6-25 does not list
      and Table 6-26 never consults. (7) The structured log events, for the same
      reason 6.3 through 6.7 left theirs alone.
