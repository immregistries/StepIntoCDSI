      The 11 red tests, expected vs actual. (1)
      tableSixTwentyThreeNamesItsAttributesAsTheSpecificationDoes - expected Table
      6-23 row 2's attribute type "Vaccine dose administered"; actual "Supporting
      Data (Live Virus Conflict)", though the value it carries is correct. (2)
