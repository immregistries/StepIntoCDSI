      second condition, "is there at least one vaccine dose administered on or
      before the current vaccine dose administered date?", is No, and that
      condition scans dataModel.getAntigenAdministeredRecordList(), which in a
      real pipeline run always contains the current dose itself. So in a full
      engine run the condition is always Yes and no spurious marker is written -
