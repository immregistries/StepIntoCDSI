summary: >
  The ninth Role B round: section 4.2's note 2a (age-based CVX-to-antigen
  association - e.g. CVX 121 Zoster live associates with Varicella under
  50 years, Zoster from 50 on) was entirely unimplemented, a complete
  gap rather than a logic bug. The Supporting Data's Association
  Begin/End Age attributes were read by nothing and stored nowhere, so
  a Zoster-live dose always produced both a Varicella and a Zoster
  record at any age. Fixed across VaccineType (new per-antigen age
  maps), DataModelLoader (reads the two fields), and
  OrganizeImmunizationHistory (filters by patient age at administration,
  begin inclusive/end exclusive). Unit 4.2 fully closed (12/12, +1 new
  boundary test). Full cdsi-engine suite: 171 -> 169 failures (down
  exactly 2), 0 regressions. FITS suite unchanged (3378/1517/1, 0 cases
  changed, not even a hidden output change) - none of the bundled
  fixtures exercises this exact scenario. See SPEC-4.6-0016.
