summary: >
  Requested directly, following on from Round 13: close out RSV's four
  remaining FITS failures before moving to COVID-19. Found and fixed two
  more previously-hidden engine defects, plus a second CVX-equivalence
  data gap, all four remaining cases traced to precisely:

  1. SPEC-4.6-0023: DataModelLoader's <seasonalRecommendation> parsing
  branch created the record and linked it to its series dose but never
  read the node's own <startDate>/<endDate> children - both fields stayed
  null forever, for every antigen that declares a seasonal recommendation
  (confirmed for RSV; likely also Influenza and COVID-19). The two
  consuming steps (7.4's Table 7-11 end-date check, 7.5's
  FORECASTDTCAN-1 start-date bullet) were already correctly written,
  reading from the right accessor - it just never returned real data.
  Fixed by parsing the dates in the loader (reusing the existing
  parseDate(String) helper), with a new DataModelLoaderTest asserting the
  bundled release's RSV series carries non-null, correctly-ordered dates
  without pinning the exact literal values (matching that test class's
  own stated policy of not breaking on routine CDC data updates).

  This fix alone: +214 FITS improvements (143 PCV, 37 COVID-19, 32 RSV, 2
  FLU) and 30 regressions, all old NIST fixtures (dated 2013-2016, 2020,
  2024) now correctly measured against the bundled Supporting Data's
  actual, current 2025-2026 season window - a window their own historical
  evalDate predates. Not fixable without inventing an unsupported
  "nearest matching season" computation the specification never
  describes; presented to the project owner as an explicit choice per the
  standing "FITS moves forward, not backward" rule, given the net effect
  (+184) - decision was to ship.

  2. SPEC-4.6-0024: a full-text extraction pass earlier in this campaign
  missed that FORECASTDTCAN-1 has six bullets, not five - the sixth,
  "date administered of the most recent vaccine dose administered being
  evaluated against a target dose" (any outcome), was implemented far too
  narrowly: computeEarliestDate() only checked vda.getTargetDose() != null,
  a field 6.10 Satisfy Target Dose sets on its one VALID outcome alone.
  The fifth bullet (inadvertent administrations specifically) was not
  implemented at all - Table 6-13's "yes, inadvertent" outcome shortcuts
  straight back to 4.4 without ever reaching 6.10, so no existing link
  field gets set for it either. Fixed with a new, dedicated
  VaccineDoseAdministered.inadvertentAdministration flag (a fact about
  that one administration, not a pointer to the shared, mutable target
  dose an earlier or later administered dose could overwrite), set by 6.3
  and read by 7.5 alongside the existing (now also broadened) checks. An
  already-written unit test regressed on the first attempt (its hand-built
  fixture predates the evaluatedAgainstTargetDose convention and only
  sets targetDose directly) and was fixed by keeping both checks rather
  than replacing one with the other.

  3. A second CVX-equivalence data bug in the same family as Round 13's
  CVX 122/Rotavirus mixup: CVX 314 ("Respiratory syncytial virus (RSV)
  vaccine, unspecified," confirmed against the bundled Supporting Data's
  own inadvertentVaccine/allowableVaccine entries) was missing from
  CvxEquivalence's RSV group in both cdsi-fits-tests and cdsi-web,
  causing a fully-correct engine forecast to be reported as "No
  forecasted vaccine group matched CVX 314." Added alongside the earlier
  122 removal.

  Verified via the standing Role B pipeline throughout: full cdsi-engine
  suite confirmed as an identical failure *set* before/after (not just
  count) via sorted diff at each step; full FITS run, case-by-case diffed
  against the pre-fix baseline: +228 improvements total this round (143
  PCV, 40 COVID-19, 38 RSV, 5 HepB, 2 FLU), 30 regressions (all the
  already-reviewed SPEC-4.6-0023 season-staleness set, unchanged in
  count from the intermediate fix), net +198.

  RSV: of 50 FITS cases, only 4 remain failing - the SPEC-4.6-0023
  season-staleness cases themselves (2023-0028/0031/0032/0033, all old
  fixtures whose expected 2024-season dates cannot be reproduced against
  the bundled release's 2025-2026 season data). RSV's failure rate:
  92% before Round 13 -> 36% after Round 13 -> 16% now, and it has
  dropped out of the worst-10 list entirely. Considered closed for this
  campaign's purposes; the 4 remaining cases are a known, accepted,
  documented exception, not a live defect.

  COVID-19 is now the clear worst-performing group (275/341 failing,
  80.65%) - next requested target. FLU is now second-worst (71/91,
  78.02%), almost entirely the same SPEC-4.6-0023 season-staleness
  pattern (FLU declares its own seasonal recommendations) rather than a
  new defect - worth confirming before spending investigation time there.
