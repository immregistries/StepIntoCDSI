summary: >
  Moved forward to the next unit in spec order after fully closing out
  6.2's actionable work (rounds 24-25) - unit 6.3, Evaluate for
  Inadvertent Vaccine. status.yaml's pre-existing notes had already
  diagnosed all three of its reds precisely, including the exact
  materiality count and the observation that two of them mask each
  other in production today.

  Fixed all three together, per the note's own analysis that they
  couldn't be split (fixing the loader gap alone would have turned a
  silent miss into a crash): (1) DataModelLoader never parsed the
  Supporting Data's <inadvertentVaccine> element at all - 307 real
  entries across 8 antigens (COVID-19, Polio, Tetanus, Diphtheria, RSV,
  Pneumococcal, HPV, Pertussis) were silently discarded at load time,
  making Table 6-13's Rule 1 unreachable on any real forecast; (2)
  Table 6-12's own second attribute was dead code - constructed,
  registered, mistyped, and never assigned, though the step's actual
  decision never read it either, so this only affected what the step
  publishes for display; (3) Rule 1's outcome could NullPointerException
  writing to a target dose's not-yet-created Evaluation - the identical
  shape already fixed for 6.1 in SPEC-4.6-0030, reapplied here.

  Final verification: unit 6.3's own suite 11/11 green (up from 8/11);
  full engine suite 118 failures/1 error (down from 121/1,
  sorted-diff-confirmed as exactly those 3 tests); full FITS run: 3627
  passed both before and after, 0 changed cases - none of the bundled
  fixtures happens to record an administered dose matching one of the
  307 real inadvertent-vaccine entries against the specific target
  dose it's declared on. A genuine correctness fix the current
  fixture set doesn't happen to exercise, the same category as
  SPEC-4.6-0026's CALCDT-5 fix and SPEC-4.6-0030's 6.1 NPE guard.

  Fourth consecutive unit-closing round today (following 4.4, 5.1, 6.1,
  6.2) with zero FITS regressions.
