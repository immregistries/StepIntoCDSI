summary: >
  The seventh Role B round: FORECASTDT-2's ordinary no-earliest-age/
  no-earliest-interval fallback read the wrong (empty) forecast list and
  silently returned wall-clock "now" instead of the series' own earliest
  date - the ordinary case for the majority of series doses, meaning the
  recommended date changed every day the engine was run. Fixed by
  calling the class's own already-correct computeEarliestDate() instead.
  Confirmed against real FITS data: 25 real cases (5 distinct Polio
  scenarios) had their computed output genuinely change from a
  run-date-dependent value to a stable, patient-derived one - though
  none flip pass/fail, since each has its own separate, unrelated
  defect. Full cdsi-engine suite: 180 -> 179 failures (down exactly 1),
  0 regressions. FITS aggregate counts unchanged (3364/1531/1), verified
  case-by-case per the SPEC-4.6-0013 lesson. See SPEC-4.6-0014.
