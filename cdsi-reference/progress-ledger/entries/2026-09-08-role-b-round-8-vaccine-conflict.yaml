summary: >
  The eighth Role B round, and the first in this whole pass to actually
  move the FITS suite. EvaluateVaccineConflict's live-virus conflict
  window was effectively dead code in any normal chronological history:
  its per-previous-dose loop scanned doses after the current one
  instead of before, a copy-paste bug always collapsed the conflict end
  date to the begin date, the begin boundary was exclusive instead of
  the documented inclusive, and matching ignored the conflicting
  vaccine type. Fixing all four flipped 14 real FITS cases (3 distinct
  scenarios - two MMR-after-MMR-too-soon, one Varicella - all from
  standard age-based routine schedule test plans) from FAIL to PASS,
  with 0 regressions. Full cdsi-engine suite: 179 -> 171 failures (down
  exactly 8). FITS suite: 3364 -> 3378 passed (68.7% -> 69.0%). See
  SPEC-4.6-0015.
