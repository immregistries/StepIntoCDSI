summary: >
  The eleventh Role B round, and the largest of this campaign: Chapter 8
  (8.1-8.8) never implemented the per-series-group repetition its own
  overview text requires, and the eight steps disagreed about which of
  three different lists was "the series in scope" - the 2026-09-05
  "Chapter 8 has no series group" cross-cutting entry. Implemented a
  new SelectNextSeriesGroup step (dispatched from 4.5, looped back to
  by every 8.1-8.7 scoring-phase exit), corrected the pipeline-stage
  list every affected step reads, and parsed the previously-unread
  <equivalentSeriesGroups> Supporting Data element 8.8's Table 8-14
  needs. Two independent unit-local bugs (8.5/8.6's sticky-boolean
  defect, 8.6's tie-counter reset) were fixed alongside.

  Verified against all nine affected units' own JUnit suites - every
  remaining red in each reconciles exactly against an already-documented,
  unrelated, pre-existing defect (confirmed by cross-referencing this
  round's failures against each unit's own status.yaml red-test
  enumeration). Full cdsi-engine suite: 167 -> 139 failures (-28), 0 new
  errors.

  FITS regresses: 3378 -> 3253 passed (net -125: 175 cases regress,
  mostly Pneumococcal/RSV/Meningococcal; 50 improve, mostly HepA/Polio/MMR).
  Traced via direct engine instrumentation to a second, separate,
  upstream defect - SelectPatientSeries.minAgeToStart/maxAgeToStart are
  enforced nowhere in the engine, so an age-inappropriate solo-series
  series group (e.g. "Pneumococcal 50+", minAgeToStart 50 years) can
  now become a "best patient series" once Chapter 8 is correctly
  scoped, where before it simply lost an undivided antigen-wide scoring
  competition. Recorded as SPEC-4.6-0021, not yet fixed - its most
  likely home is upstream of Chapter 8 entirely (4.3/5.1's determination
  of what counts as a relevant patient series in the first place).

  Presented to the project owner as a genuine choice (hold pending
  SPEC-4.6-0021, keep investigating a same-session fix, or merge
  despite the regression); the explicit decision was to merge now,
  accepting the regression, because the fix is independently verified
  correct, the regression's cause is fully traced to a separate
  pre-existing defect rather than an error in this fix, and the 50-case
  improvement it also produces is real forward progress expected to
  combine cleanly with SPEC-4.6-0021's eventual fix. Recorded as a
  deliberate, informed exception to the standing "FITS moves forward,
  not backward" rule, for CDC/CDSi review.
