summary: >
  Second unit tackled under the JUnit-first strategy, continuing forward
  from unit 4.4 (round 18). status.yaml's pre-existing notes for 5.1
  (SelectRelevantPatientSeries) had already diagnosed all four gaps
  driving its 7 red tests precisely enough to act on directly.

  Fixed three cleanly: (1) Table 5-4 condition 0 ("does the indication
  describe any active patient observations?") was a hardcoded NO stub -
  now reads the patient's MedicalHistory for a matching ObservationCode.
  (2) Table 5-4 Rule 3 was encoded with its first condition as ANY
  instead of UNKNOWN, making the "flag for clinician" outcome a
  strictly weaker copy of Rule 2's ordinary "does not apply" outcome -
  fixed by encoding UNKNOWN, which the (now-implemented) condition
  never returns, correctly making Rule 3 unreachable via this path.
  (3) Table 5-5's own gender-check condition read caGender/caRequiredGender
  attributes that were only ever populated on its LT54 children, never
  on LT55 itself - both stayed null, so the condition always took its
  "no required genders" early Yes regardless of the series' actual
  restriction. Now LT55 gets its own copies, populated the same way.

  The fourth gap - AntigenSeries.getRequiredGenderList() never being
  populated by DataModelLoader from the series-level <requiredGender>
  element - was confirmed and a fix written, but measured (not assumed)
  to be unsafe to ship alone: Patient.getGender() carries ForecastInput's
  raw "F"/"M" vocabulary with zero normalization, while Supporting
  Data's <requiredGender> values are "Female"/"Male"/"Unknown". Adding
  the missing parsing branch alone caused a 388-case FITS regression -
  100% in HPV, 0 improvements - because every gender-restricted series
  (all 4 of the bundled release's HPV series) flipped to "not relevant"
  for every patient, including the correct gender, once the comparison
  actually started running against never-matching strings. Reverted in
  full; a fresh FITS run confirmed the revert restores the exact
  3-gaps-fixed baseline (3511 passed, 0 changed cases).

  This is deliberately NOT bundled into the same round: fixing it
  safely requires deciding where "F"/"M" <-> "Female"/"Male"/"Unknown"
  normalization belongs, a cross-cutting question that also touches
  4.10 EvaluateGender's own separate (and separately flagged as likely
  dead) gender comparison over a third domain type. Recorded as
  SPEC-4.6-0029 (open) with the regression already measured, so
  whoever picks it up next has the exact blast radius in hand rather
  than needing to rediscover it.

  Final verification: unit 5.1's own suite 23/23 green (up from 16/23);
  full engine suite 127 failures/1 error (down from 134/1, sorted-diff-
  confirmed as exactly those 7 tests); full FITS run for what was
  actually shipped: 3511 passed both before and after, 0 changed cases
  - the fixture format carries no PatientObservation/MedicalHistory
  data at all, so fix (1) is FITS-inert for the same reason
  SPEC-4.6-0026's CALCDT-5 fix was, and fixes (2)/(3) are inert only
  because of the deferred fourth gap.

  Second consecutive round with zero regressions in what actually
  shipped, and the second round in a row where a mid-flight discovery
  (a second, unrelated defect one level deeper) was investigated,
  measured, and explicitly deferred with evidence rather than either
  blindly shipped or silently dropped.
