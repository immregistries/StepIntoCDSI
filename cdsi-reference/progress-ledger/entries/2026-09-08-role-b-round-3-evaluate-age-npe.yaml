summary: >
  The third Role B round, and the first to surface a genuine
  specification-level gap rather than a code/spec mismatch: Table 6-14
  gives Minimum Age Date and Absolute Minimum Age Date the same flat
  01/01/1900 default, applied independently, which Table 6-15's rule
  grid cannot always resolve - a target dose with an absolute minimum
  age but no minimum age crashed the engine with an NPE on 5 real
  bundled Pneumococcal series doses. Filed as SPECIFICATION_DEFECT and
  explicitly flagged for CDC/CDSi review rather than treated as settled
  by this project's own fix. Reviewed and approved a pragmatic
  resolution: fall the minimum age date back to the absolute minimum age
  date when only the latter is defined. Unit 6.4: 19/1 -> 20/0 green/red.
  Full cdsi-engine suite: 188 -> 187 failures (down exactly 1), 0
  regressions. FITS suite unchanged (3364/1531/1 identical both sides) -
  none of the 4896 bundled fixtures reaches the affected input shape.
  See SPEC-4.6-0010.
