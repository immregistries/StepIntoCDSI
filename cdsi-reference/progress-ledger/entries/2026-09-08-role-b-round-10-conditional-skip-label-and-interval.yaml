summary: >
  The tenth Role B round, on unit 6.2's EvaluateConditionalSkip (shared
  base class also used by 7.1 and 7.6). Fixed two narrow, verified-safe
  mismatches: Table 6-6's stale "Table 4-6" label, and Table 6-8's
  interval condition excluding its own documented equality boundary
  (SPEC-4.6-0017). cdsi-engine: 169 -> 167 failures (down exactly 2),
  0 regressions. FITS: strict no-op (3378/1517/1 both sides, 0 cases
  changed by strict case-by-case diff).

  This round also investigated two further candidate fixes of the
  identical shape and found both to be real spec mismatches whose fixes
  are correct in isolation but not safe to merge yet: Table 6-6's
  age-window lower bound (SPEC-4.6-0018 - fix produces a net +101 FITS
  improvement but a 14-case regression traced to the already-documented
  "Chapter 8 has no series group" defect) and Table 6-9's "equal to"
  dose-count comparator (SPEC-4.6-0019 - fix is correct but exposes a
  separate, pre-existing NPE in PatientSeries.getForecast() downstream,
  324 FITS execution errors). Both recorded as open findings for a
  future round rather than merged, per the standing rule that FITS must
  move forward, not backward.
