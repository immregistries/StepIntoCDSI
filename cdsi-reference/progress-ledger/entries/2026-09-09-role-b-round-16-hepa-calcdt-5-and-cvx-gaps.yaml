summary: >
  Requested directly: get one FITS group to pass completely, starting
  with HepA (a simple schedule, only 4 failures at the time). Found and
  fixed a genuine, real date-arithmetic bug (SPEC-4.6-0026), plus a third
  CVX-equivalence gap in the same family as Round 13/14's - but HepA
  cannot reach 100% without either a project-owner ruling on a spec-vs-
  fixture conflict or new CDC Supporting Data content, neither of which
  is something engine code can resolve.

  All 4 of HepA's failures traced back to the exact same underlying
  computation - a dose administered 08/29/2026, HepA's minInt of "6
  months," landing on a nonexistent 02/29/2027 (2027 is not a leap year)
  - split across two genuinely different problems:

  1. SPEC-4.6-0026 (fixed): TimePeriod.getDateFrom()'s CALCDT-5 handling
  ("a computed date which is not a real date must be moved forward to
  first day of the next month") read the day-of-month back from the
  Calendar object *after* already setting its month/year fields with the
  original day still in place - but Calendar.set(MONTH, ...) doesn't
  clamp an out-of-range day, it silently rolls the excess forward (day 31
  landing on a 28-day February becomes March 3rd, not February 28th or
  March 1st). The dedicated CALCDT-5 check could therefore never fire
  correctly; the answer produced was whatever Calendar's own overflow
  arithmetic happened to compute, which only coincidentally matches
  CALCDT-5 for a 1-day overflow (like this HepA case, and like the
  smaller of the specification's own two worked examples) and not for a
  larger one (the specification's other worked example, 08/31 + 6
  months, was actually wrong by 2 days before this fix - 03/03/2001
  instead of the specified 03/01/2001). Fixed by capturing the day-of-
  month before any month/year mutation and only then checking it against
  the target month's real maximum. Two new TestTimePeriod tests pin the
  specification's own worked examples plus the HepA-observed case;
  full cdsi-engine suite unchanged (identical failure set via sorted
  diff); full FITS run: 0 regressions, 0 improvements - the multi-day-
  overflow case this fix actually corrects does not occur anywhere in
  the current fixture set, only in the hand-authored test pinning the
  spec's own example. A real, worthwhile correctness fix regardless.

  2. Not fixed - a genuine spec-vs-fixture conflict: three HepA fixtures
  (AART-EXTRA-3/5/7) all expect 02/28/2027 for this exact computation,
  directly contradicting CALCDT-5's own literal text and worked examples
  (both of which compute 03/01/2027, correctly, both before and after
  this round's fix). This cannot be resolved by further engine changes -
  the specification text is unambiguous, and these fixtures disagree with
  it. Needs a project-owner or CDC/CDSi decision about whether these
  "Extra Test Cases" fixtures are authoritative for this scenario, not
  something Role B can decide unilaterally.

  3. Not fixed - a Supporting Data completeness gap: HepA's fourth
  failure (AART-EXTRA-10) throws IllegalArgumentException: Unrecognized
  cvx code '143' - confirmed absent from every antigen file and the
  schedule-level CVX map in the entire bundled 4.65 Supporting Data
  release, not just HepA's own file. This is correct, defensive engine
  behavior given the input; the gap is in the Supporting Data content
  itself (a future CDC/ACIP release, or a fixture ahead of what's
  bundled), not something engine code or a CvxEquivalence table entry can
  fix without fabricating vaccine registry data.

  Also fixed while investigating: CvxEquivalence's HepA group was missing
  CVX 82 (adult formulation) alongside its existing 85 (unspecified) and
  52 (pediatric) - the same class of gap as Round 13/14's CVX 122/314
  fixes. Added to both cdsi-fits-tests' CvxEquivalence.java and cdsi-web's
  FitsServlet.java. This alone did not flip AART-EXTRA-10's outcome,
  since that case fails earlier (the CVX-143 exception above), before
  the equivalence table is ever consulted.

  Net effect: HepA remains at 4 failures (96/100 passing, 96%), unchanged
  from before this round in raw pass count, but for well-understood,
  fully-documented reasons rather than an open question - one is a real,
  now-fixed engine bug with no FITS-visible effect yet, one needs a
  project-owner ruling, and one needs new Supporting Data. No FITS group
  reached 100% this round; the closest remaining candidates are worth a
  fresh survey once SPEC-4.6-0026's sibling question is resolved.
