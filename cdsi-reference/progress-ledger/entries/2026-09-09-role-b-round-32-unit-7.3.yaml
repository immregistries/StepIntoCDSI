summary: >
  Moved to unit 7.3 after closing 7.2 (round 31) - by far the least
  complete unit tackled so far (8/24 green). status.yaml's own pre-
  existing notes had already root-caused all sixteen reds into four
  groups, all anticipated by the step package's Review Findings.

  Fixed four compounding gaps together, since none was independently
  useful without the others: (1) DetermineContraindications built
  zero decision tables at all - its own header comment read "Write
  the logic for logic tables 7-5 to 7-7"; (2) DataModel.contraindicationList
  was typed for an unrelated, wrong domain class, so the step's own
  commented-out read line would not have compiled even if uncommented;
  (3) the loader discarded almost every field of each contraindication
  (age window, clinician text, contraindicated vaccine types, and the
  antigen-versus-vaccine distinction itself); (4) Table 7-4's two
  assumed values were swapped, which alone would have silently
  defeated 387 of the release's 392 contraindications even after
  everything else was fixed.

  Built all three decision tables (7-5, 7-6, 7-7) as single reusable
  instances re-evaluated once per relevant contraindication candidate
  from process()'s own loop - deliberately not a looser "OR across all
  contraindications per condition" design, which would risk false
  positives against the release's 392 real entries by combining
  unrelated contraindications' own attributes.

  Final verification: unit 7.3's own suite 23/24 green (up from 8/24;
  the 24th is left red, classified UNDETERMINED - the same
  structurally-unsatisfiable-test shape as unit 7.2's equivalent);
  full engine suite 86 failures/1 error (down from 101/1, sorted-diff-
  confirmed as exactly those 15 tests across all 783 tests); full FITS
  run, case-by-case diffed: 3637 passed both before and after, 0
  changed cases - the FITS fixture format has no way to encode a
  patient's own recorded clinical observations at all, and every one
  of the release's 392 contraindications requires exactly that to
  ever apply, so this substantial correctness fix is entirely
  FITS-inert by construction, the same category as SPEC-4.6-0035 and
  SPEC-4.6-0039.

  Ninth consecutive unit-closing round today (4.4, 5.1, 6.1, 6.2, 6.3,
  6.5, 6.7, 6.8, 6.10, 7.2) with zero FITS regressions.
