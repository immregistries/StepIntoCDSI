summary: >
  Moved forward to the next unit in spec order after fully closing out
  6.3 (round 26) - unit 6.5, Evaluate Preferable Interval's last two
  reds. status.yaml's pre-existing notes had already diagnosed both
  precisely as one cluster: CALCDTINT-9 (Table 6-19's fourth
  reference-date business rule), blocked in three separate places at
  once and deliberately deferred out of the earlier SPEC-4.6-0013
  round.

  Fixed all three together, since none is independently useful without
  the others: (1) DataModelLoader.readSeriesDose's interval branch had
  no case for <fromRelevantObs> at all, so no interval loaded from
  real Supporting Data ever carried one; (2) ObservationCode had no
  equals()/hashCode(), so even loaded data could never successfully
  match the patient's own recorded observation history (two
  independently-constructed instances that can never be
  reference-equal); (3) Interval.getPatientReferenceDoseDate's own
  CALCDTINT-9 branch only logged its own use and never assigned a
  date, so even a successful match would have had no effect.

  Final verification: unit 6.5's own suite 30/30 green (up from 28/30,
  the last two reds in the unit); full engine suite 116 failures/1
  error (down from 118/1, sorted-diff-confirmed as exactly those 2
  tests); full FITS run: 3627 passed both before and after, 0 changed
  cases - exactly as status.yaml's own note predicted, since the
  bundled FITS fixture format has no observation field at all and
  cannot exercise this rule under any circumstances. A genuine
  correctness fix the current fixture set doesn't happen to exercise,
  the same category as SPEC-4.6-0026, SPEC-4.6-0030, and
  SPEC-4.6-0034.

  Noted but deliberately left open: all 6 real <fromRelevantObs>
  intervals in the bundled Supporting Data sit on Dose 1, and
  getPatientReferenceDoseDate returns null outright whenever the
  previous target dose is null - a separate, cross-rule gap (affecting
  every CALCDTINT rule alike on Dose 1) that means this fix, while now
  provably correct, still cannot take effect against any real
  Supporting Data occurrence today.

  Fifth consecutive unit-closing round today (following 4.4, 5.1, 6.1,
  6.2, 6.3) with zero FITS regressions. All four CALCDTINT reference-
  date rules (1, 2, 8, 9) in Table 6-19 are now correctly implemented.
