summary: >
  The first Role B fix: unit 6.8's EvaluateForPreferableVaccine used a strict
  "<" comparison for a boundary its own spec label documents as "<=",
  excluding a dose administered exactly on the preferable vaccine's begin
  age date (most visible on "0 days" begin-age windows, e.g. a HepB birth
  dose). One-line fix to the codebase's existing inclusive-bound idiom
  flips the two JUnit tests exercising that boundary from red to green
  (25/5 -> 27/3 for the unit), with zero regressions across the full
  cdsi-engine suite (192 -> 190 failures) and zero change to the FITS
  suite (3364/1531/1 identical both sides - by design, this round targets
  JUnit correctness, not FITS pass-rate movement). See SPEC-4.6-0008.
