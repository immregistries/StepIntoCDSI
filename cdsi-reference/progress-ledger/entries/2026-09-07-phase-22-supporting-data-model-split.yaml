summary: >-
  Split DataModel into a shared, cached SupportingDataModel (static
  Supporting Data, loaded once) and a slimmed DataModel (per-run mutable
  state only), so DataModelLoader.createDataModel no longer re-parses the
  Supporting Data ZIP on every FITS case. Every cdsi-engine test and every
  FITS case (3,364 passed / 1,531 failed-assertion / 1 execution-error, on
  both sides) is byte-for-byte identical before and after - the three new
  engine_tests total came from three added regression tests, not a
  behavior change. Full FITS suite runtime dropped 11.5x, from 457.5s to
  39.9s.
