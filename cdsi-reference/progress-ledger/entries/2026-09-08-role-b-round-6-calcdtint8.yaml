summary: >
  The sixth Role B round, and the first attempted specifically to move a
  FITS case - it didn't, but the investigation is the story worth
  recording. CALCDTINT-8 was effectively dead code (a missing null check
  threw a silently-swallowed NPE every time) and the loader never parsed
  Supporting Data's multi-CVX <fromMostRecent> list. A first fix attempt
  caused a real 20-case FITS regression; root-caused via direct engine
  inspection to a missing lower bound letting a dose reference itself as
  its own "most recent" reference date - not the extraneous-dose theory
  first suspected, which had zero actual effect. Extended into unit 6.10
  (SatisfyTargetDose) with explicit project-owner approval, adding a new
  VaccineDoseAdministered.evaluatedAgainstTargetDose link rather than
  reusing fields other steps depend on staying null. Net FITS effect: a
  strict no-op (0 cases changed either direction) - the 13 cases that
  appeared to improve mid-investigation were themselves an artifact of
  the self-reference bug, not a real fix. Full cdsi-engine suite: 182 ->
  180 failures (down exactly 2), 0 regressions. See SPEC-4.6-0013.
