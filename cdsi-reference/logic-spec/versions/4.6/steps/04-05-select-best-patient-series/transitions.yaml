    to: "8.1"
    verified_in: "org.openimmunizationsoftware.cdsi.core.logic.SelectBestPatientSeries#process"
  - condition: "all antigens have been processed"
    to: "4.6"
    verified_in: "org.openimmunizationsoftware.cdsi.core.logic.SelectBestPatientSeries#process"
