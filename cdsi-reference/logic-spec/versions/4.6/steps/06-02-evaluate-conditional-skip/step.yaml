  note: >
    EvaluateConditionalSkipForEvaluation is a near-empty subclass of
    EvaluateConditionalSkip, which holds all the actual logic (Tables
    6-4 through 6-11) and is shared verbatim with 7.1's
    EvaluateConditionalSkipForForecast - matching the specification's
    own statement that this logic "is defined here once, but used in
    both Evaluation and Forecasting." 6.2 excludes the current VDA from
    CONDSKIP-1; 7.1/7.6 count every administered dose (SPEC-4.6-0063).
tests:
