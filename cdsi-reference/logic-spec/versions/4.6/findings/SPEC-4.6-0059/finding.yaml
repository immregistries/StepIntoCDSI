id: "SPEC-4.6-0059"
status: "open"
category: "IMPLEMENTATION_MISMATCH"
spec_sections: ["6.2", "7.1"]
source_pages: [47, 49, 69]
tables: ["Table 6-5", "Table 6-8", "Table 6-11"]
business_rules: ["CALCDTSKIP-5"]
code_locations:
