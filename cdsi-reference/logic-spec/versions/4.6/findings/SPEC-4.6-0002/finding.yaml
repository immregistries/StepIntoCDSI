fits_cases: []
summary: >
  LogicTable.evaluate(), the one shared mechanism every decision table in
  every LogicStep is built from, never enforces that exactly one rule
  column matched - the safety check exists in code but is commented out.
evidence: >
  Section 2.11's decision-table notation assumes a table's rule columns are
  mutually exclusive (a Default outcome fires only when none of the
  explicit rules match). LogicTable.evaluate() contains a check that would
  raise IllegalStateException when validColumnCount != 1 and
  logicOutcomeDefault == null - i.e. when more than one rule column
  matched and there's no default to prefer - but that throw is commented
  out. As written, if two rule columns both match, evaluate() calls
  perform() on both outcomes in table order, with the later one's state
  changes silently taking precedence and nothing logged.
interpretation: >
  This is a property of the shared mechanism every decision table in the
  system depends on, not a one-off gap in a single step - it could
  silently affect any step package whose specific conditions aren't
  perfectly mutually exclusive for some input combination. Not fixed here
  per standing project direction (this check was very likely commented out
  deliberately to get the processes to execute, with fixing intended
  later) - worth prioritizing appropriately whenever gap-fixing work
  begins, precisely because of how many step packages it could affect at
  once. See docs/12-decision-table-semantics-and-rule-evaluation-order.md,
  which independently calls more-than-one-match "almost always an
  implementation defect, not a valid CDSi state."
