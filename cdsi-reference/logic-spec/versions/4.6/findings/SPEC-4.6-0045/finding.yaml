fits_cases: []
summary: >
  Chapter 8 scoring relied on an accumulating mutable score with no explicit
  reset boundary and duplicated common series metrics across scoring steps.
  Add domain-level metrics, a canonical last-target-dose maximum-age helper,
  an explicit reset, and a shared N-way extremum scorer. This foundation is
  behavior-neutral; the shared scorer is consumed by later sequenced fixes.
evidence: >
  PatientSeries exposed increment/decrement score methods but no reset method.
  The Chapter 8 scoring classes independently counted satisfied target doses,
  inspected product paths, and calculated maximum-age dates. The latter copies
  used the forecast target dose and did not recurse through TimePeriod child
  values, despite TimePeriod.getDateFrom(Date) already providing that behavior.
interpretation: >
  Establishing these operations at their owning abstractions reduces divergent
  implementations and makes the per-scoring-pass score invariant explicit.
