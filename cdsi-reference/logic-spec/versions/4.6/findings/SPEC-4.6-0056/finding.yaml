summary: >
  After SPEC-4.6-0055, 6.4/6.5/7.4 still used Age list index 0 and every
  Preferable Interval row, so Polio Dose 4's ceased 18-week age and 4-week
  interval still applied on evaluation and forecast-need.
evidence: >
  EvaluateAge and DetermineForecastNeed still called getAgeList().get(0);
  EvaluatePreferableInterval looped the full interval list. Polio Dose 4
  also has dual preferable intervals (cessation 20090806 minInt 4 weeks;
  effective 20090807 minInt 6 months). POL-2013-0640 title states the
  4-year dose given less than 6 months after dose 2 is not valid and the
  child needs another; engine was COMPLETE.
interpretation: >
  Same RelevantSupportingData helper: date administered for 6.4/6.5,
  assessment date for 7.4. Allowable Interval (6.6) remains a follow-on.

  Verified on run 2026-09-15T215530 vs 2026-09-15T195518: combined FITS
  4046 to 4094 (net +48). POL 504 to 554 (+50); MenB 2024-0075/0076 +8.
  Oracle POL-2013-0640 still COMPLETE - 6.5 now fails the 6-month interval
  alone, then empty 6.6 allowable still accepts the dose. Collateral
  COVID-19 -10 / 11 new allowlist reds; COVID parked.
