id: "SPEC-4.6-0007"
status: "confirmed"
category: "IMPLEMENTATION_MISMATCH"
spec_sections: ["8.6"]
source_pages: [91]
tables: ["Table 8-11", "Table 8-12"]
business_rules: ["SELECTB-3", "SELECTB-12", "SELECTB-14", "SELECTB-23"]
code_locations:
  - "org.openimmunizationsoftware.cdsi.core.logic.NoValidDoses"
fits_cases: []
summary: >
  NoValidDoses's "is completable" scoring condition always contributes +1
  regardless of the actual finish-date/max-age comparison, and two scoring
  conditions run that aren't in Table 8-11 at all.
evidence: >
  evaluate_ACandidatePatientSeriesIsCompletable()'s if/else both call
  patientSeries.incPatientScoreSeries() - there is no code path that ever
  decrements for this condition, contradicting Table 8-11's documented
  +1/-1 split. This looks like a copy-paste slip (the else branch should
  very likely call descPatientScoreSeries(), matching the pattern every
  other condition in this scoring family uses). Separately, two scoring
  conditions run that aren't in Table 8-11 at all: a gender-match bonus
  and an exceeded-maximum-age penalty.
interpretation: >
  As written, "is completable" always contributes +1 regardless of the
  actual finish-date/max-age comparison. The two extra scoring conditions
  (gender-match bonus, exceeded-max-age penalty) are unconfirmed as
  intentional or not - this could be a deliberate, undocumented
  refinement, or a copy-forward from a different section's logic that
  doesn't belong here; this pass could not determine which and records it
  as an open question rather than resolving it by guessing. If real
  Supporting Data commonly has gender-restricted or near-max-age series
  competing under this scoring path, this materially changes the outcome
  versus a spec-literal implementation. Tracked, not fixed, per standing
  project direction. See SPEC-4.6-0005 for a second, unrelated bug in this
  same class (Date reference-equality breaking tie-detection).
  UPDATE 2026-09-02: the always-increments defect was re-verified against
  current source and bytecode, and a one-line fix (else branch calls
  descPatientScoreSeries) plus a new focused unit test
  (NoValidDosesCompletableTest) are implemented and AWAITING THE PROJECT
  OWNER'S REVIEW - status stays "open" because no human has reviewed it
  yet. The fix is provably behaviour-preserving on the current fixture
  set: full FITS suite before and after is identical (3364 pass / 1531
  fail / 1 error of 4896), with zero status changes and zero cases whose
  engine output changed. Instrumented runs show this is not because the
  code is dead - the corrected branch ran 1,236,735 times and changed
  scores in 10,057 patient-series selections, 1,586 of which shifted
  competing candidates by different amounts - but because the selected
  patient series never differed in any of 112,750 selections. The other
  two open questions in this finding were deliberately NOT touched.
